<!doctype html>
<html lang="en" data-palette="ocean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CT-GenAI Go-Live – ISTQB® CT-GenAI exam preparation</title>
<meta name="description" content="A phone course preparing for the ISTQB® Certified Tester – Testing with Generative AI (CT-GenAI) exam, syllabus v1.1.">
<meta name="theme-color" content="#123C69">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#550C93; --pink:#F0386B; --yolk:#FFC914;
  --paper:#F7F7F9; --card:#FFFFFF; --ink:#1E1430; --ink-2:#5A5170; --ink-3:#877E98;
  --line:#E6E1EE; --tint:#F1EAF9; --accent:#550C93; --btn:#550C93; --btn-ink:#FFFFFF;
  --ok:#11774F; --ok-bg:#E3F4EB; --bad:#BE1A57; --bad-bg:#FDE6EE; --yolk-bg:#FFF6D8; --herb-h:#7A5A00;
  --shadow:0 1px 0 rgba(85,12,147,.04),0 14px 34px -22px rgba(85,12,147,.5);
  --r-l:24px; --r-m:16px; --r-s:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#130B1F; --card:#1D1330; --ink:#F4EEFB; --ink-2:#C0B5D2; --ink-3:#8F84A3;
    --line:#33264A; --tint:#2A1B40; --accent:#CFAAF8; --btn:#7B36CC; --btn-ink:#FFFFFF;
    --ok:#5ED39F; --ok-bg:#12302A; --bad:#FF89AA; --bad-bg:#3A1628; --yolk-bg:#342B0E; --herb-h:#FFC914;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#130B1F; --card:#1D1330; --ink:#F4EEFB; --ink-2:#C0B5D2; --ink-3:#8F84A3;
  --line:#33264A; --tint:#2A1B40; --accent:#CFAAF8; --btn:#7B36CC; --btn-ink:#FFFFFF;
  --ok:#5ED39F; --ok-bg:#12302A; --bad:#FF89AA; --bad-bg:#3A1628; --yolk-bg:#342B0E; --herb-h:#FFC914;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){header.top{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px)}}
.topin{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.015em;font-size:17px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.mark{position:relative;display:inline-grid;place-items:center;width:36px;height:28px;border-radius:9px;background:var(--btn);color:var(--yolk);font-size:12.5px;font-weight:900;letter-spacing:.03em}
.mark::after{content:"";position:absolute;left:7px;bottom:-6px;width:11px;height:10px;background:var(--btn);clip-path:polygon(0 0,100% 0,0 100%)}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--ink);cursor:pointer}
.chip .lv{color:var(--accent)}

main{padding:10px 0 calc(104px + env(safe-area-inset-bottom,0px))}
main.insession{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs[hidden]{display:none}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;background:none;border:0;color:var(--ink-3);font-size:11.5px;font-weight:700;cursor:pointer}
.tab .ti{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ti{background:var(--tint)}

/* type */
h1{font-size:30px;line-height:1.12;letter-spacing:-.028em;margin:6px 0 10px;font-weight:800}
h2{font-size:21px;line-height:1.25;letter-spacing:-.018em;margin:30px 0 10px;font-weight:800}
h3{font-size:17px;line-height:1.3;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}
.micro{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:0 0 6px}
.lead{font-size:18px;line-height:1.5;color:var(--ink-2)}
.center{text-align:center}
.right{text-align:right}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.block{width:100%}
.btn.yolk{background:var(--yolk);color:#2B1A00}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{min-height:40px;padding:0 16px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* home */
.greet{margin-top:8px}
.hero{position:relative;overflow:hidden;background:var(--plum);color:#fff;border-radius:var(--r-l);padding:22px 20px 20px;margin:14px 0 10px}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:112px;height:112px;border-radius:50%;background:var(--yolk)}
.hero .kicker{position:relative;font-size:13px;font-weight:700;color:rgba(255,255,255,.72);margin:0 0 4px;max-width:calc(100% - 92px)}
.hero h2{position:relative;color:#fff;margin:0 0 10px;font-size:23px;max-width:calc(100% - 70px)}
.hero ul{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:5px;color:rgba(255,255,255,.92);font-size:15px}
.hero li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yolk);margin:0 9px 2px 0;vertical-align:middle}
.hero .alt{display:block;margin:14px auto 0;color:#fff;opacity:.9;font-weight:600;font-size:14.5px;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.welcome{border:1.5px dashed var(--line);border-radius:var(--r-l);padding:18px 18px 8px;margin:14px 0}
.welcome ol{margin:6px 0 10px;padding-left:20px}
.welcome li{margin-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 8px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3)}
.day .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);color:#2B1A00;font-weight:900;font-size:15px}
.day.on .dot{background:var(--yolk);border-color:var(--yolk)}
.day.today .dot{border-color:var(--accent)}
.day.today .dl{color:var(--accent)}
.lvl{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.lvl-badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:900;font-size:21px;letter-spacing:-.02em;flex:none}
.lvl-name{font-weight:800;font-size:18px;letter-spacing:-.01em}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 12px 10px}
.stat b{display:block;font-size:23px;letter-spacing:-.025em;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.3;display:block}
.fact{border-left:4px solid var(--yolk);padding:4px 0 4px 14px;margin:22px 0}
.fact p{margin:0}
.badgeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.badge{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.badge .bi{font-size:26px;line-height:1.2}
.badge b{display:block;font-size:14.5px;margin:4px 0 2px}
.badge span{font-size:12.5px;color:var(--ink-2);line-height:1.35;display:block}
.badge.locked{opacity:.5;filter:grayscale(1)}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;margin:16px 0}
.panel h2{margin-top:0}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}

/* session */
.shead{display:flex;align-items:center;gap:12px;padding:12px 0 4px}
.xbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-size:17px;cursor:pointer;flex:none}
.sprog{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.sprog i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.sxp{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.sphase{font-size:13px;font-weight:700;color:var(--ink-2);margin:8px 0 14px}
.exitbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin:8px 0}
.exitbar p{margin:0 0 4px;font-size:14.5px}

.flash{position:relative;overflow:hidden;border-radius:var(--r-l);padding:34px 22px 30px;min-height:310px;display:flex;flex-direction:column;justify-content:center;background:var(--plum);color:#fff;margin-bottom:16px}
.flash::before{content:"";position:absolute;width:124px;height:124px;border-radius:50%;background:var(--yolk);right:-50px;top:-50px}
.ff-term{position:relative;font-size:clamp(52px,17vw,104px);font-weight:900;letter-spacing:-.05em;line-height:.95;overflow-wrap:anywhere;max-width:calc(100% - 36px)}
.ff-term.l{font-size:clamp(38px,11vw,68px);letter-spacing:-.035em}
.ff-term.m{font-size:clamp(30px,8.5vw,48px);letter-spacing:-.025em;line-height:1.05}
.ff-hint{position:relative;margin:20px 0 0;color:rgba(255,255,255,.82);font-size:15.5px;max-width:28ch}
.flash.back{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);justify-content:flex-start;min-height:0;padding:24px 22px}
.flash.back::before{display:none}
.fb-term{font-size:30px;font-weight:900;letter-spacing:-.03em;color:var(--accent);line-height:1.05}
.fb-en{font-weight:700;margin-top:6px}
.fb-pl{color:var(--ink-2);font-size:15px;margin-bottom:14px}
.fb-d{margin:0 0 10px}
.fb-f{font-weight:600;background:var(--tint);border-radius:var(--r-s);padding:9px 12px;font-size:14.5px;margin:0 0 10px}
.fb-b{font-size:14.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px;margin:0}
.flip-in{animation:flipin .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes flipin{from{transform:perspective(900px) rotateY(75deg);opacity:.2}to{transform:none;opacity:1}}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{min-height:62px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;padding:6px}
.grade small{display:block;font-weight:500;color:var(--ink-3);font-size:12px;margin-top:2px}
.grade.g0:hover{border-color:var(--bad)}
.grade.g1:hover{border-color:var(--accent)}
.grade.g2{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.grade.g2 small{color:rgba(255,255,255,.78)}

.lcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 20px 18px 26px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--sc,var(--plum))}
.sc-plum{--sc:var(--plum)} .sc-pink{--sc:var(--pink)} .sc-yolk{--sc:var(--yolk)}
.lc-term{font-size:clamp(42px,12vw,66px);font-weight:900;letter-spacing:-.045em;line-height:1;color:var(--accent);overflow-wrap:anywhere}
.lc-term.m{font-size:clamp(28px,7.6vw,40px);letter-spacing:-.025em;line-height:1.08}
.lc-en{font-weight:700;font-size:17px;margin-top:10px}
.lc-pl{color:var(--ink-2);margin-top:2px}
.lsec{margin-top:16px}
.lsec h4{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink-3)}
.lsec p{margin:0}
.lsec.formula p{font-weight:600;background:var(--tint);border-radius:var(--r-s);padding:10px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.lsec.herb{background:var(--yolk-bg);border-radius:var(--r-m);padding:12px 14px}
.lsec.herb h4{color:var(--herb-h)}
.lsec.phrase .say{display:inline-block;background:var(--tint);color:var(--accent);font-weight:700;border-radius:16px 16px 16px 4px;padding:8px 13px;margin:2px 0 6px}
.lsec.phrase .mean{color:var(--ink-2)}
.lsec.trap{border-left:4px solid var(--pink);padding-left:12px}
.lsec.fun{border-left:4px solid var(--yolk);padding-left:12px}
.lc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
.pill.on{background:var(--yolk);border-color:var(--yolk);color:#2B1A00}
.ai-out:empty{display:none}
.ai-out{margin-top:12px;font-size:15px}
.box{background:var(--tint);border-radius:var(--r-m);padding:12px 14px}
.box p{margin:0 0 8px}
.box p:last-child{margin:0}
.typing{color:var(--ink-3);font-style:italic}

.qlabel{font-size:13px;font-weight:700;color:var(--ink-3);margin:0 0 6px}
.qprompt{font-size:21px;line-height:1.32;font-weight:800;letter-spacing:-.015em;margin:0 0 16px}
.qprompt.big{font-size:clamp(40px,12vw,76px);font-weight:900;letter-spacing:-.045em;line-height:1;color:var(--accent);margin:4px 0 20px;overflow-wrap:anywhere}
.qquote{margin:0 0 16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);font-size:16.5px;line-height:1.5}
.opts{display:grid;gap:10px;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:15.5px;line-height:1.42;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:800;font-size:13px;margin-top:-1px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fbk{border-radius:var(--r-m);padding:12px 14px;margin-bottom:14px;font-size:15px}
.fbk.ok{background:var(--ok-bg)} .fbk.bad{background:var(--bad-bg)}
.fbk strong{display:block;margin-bottom:2px}
.fbk .fb-correct,.fbk .fb-card{display:block;margin-top:6px;font-weight:600}
.timer{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 4px}
.timer i{display:block;height:100%;background:var(--yolk);border-radius:inherit;width:100%}

.intro-stage{font-size:13.5px;font-weight:700;color:var(--ink-3);margin:8px 0 0}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px}
.tchip{padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--accent);font-weight:800;font-size:14px}
.bizcard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 22px 20px;box-shadow:var(--shadow);margin:10px 0 18px}
.bizcard::after{content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;border-radius:50%;background:var(--sc,var(--pink))}
.bizcard .fund{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.1;max-width:80%}
.bizcard .who{color:var(--ink-2);font-weight:600;margin:4px 0 14px}
.rules{font-size:14.5px;color:var(--ink-2);background:var(--tint);border-radius:var(--r-m);padding:12px 14px;margin:0 0 16px}
.xpbig{font-size:68px;font-weight:900;letter-spacing:-.045em;color:var(--accent);line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.sum-top{padding:26px 0 6px}
.sum-badges{display:grid;gap:8px;margin:14px 0}
.sum-badge{display:flex;gap:12px;align-items:center;background:var(--yolk-bg);border-radius:var(--r-m);padding:10px 14px}
.sum-badge .bi{font-size:28px}
.levelup{background:var(--btn);color:var(--btn-ink);border-radius:var(--r-m);padding:14px 16px;margin:14px 0;font-weight:700}

/* map */
.stage{margin:26px 0 6px}
.stage-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.stage-n{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--sc);color:#fff}
.sc-yolk .stage-n{color:#2B1A00}
.stage-t{margin:1px 0 2px;font-size:19px}
.sprg{font-size:13px;font-weight:700;color:var(--ink-3);margin-left:6px;font-variant-numeric:tabular-nums}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:15.5px;text-align:left;cursor:pointer}
.lrow .st{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:2px solid var(--line);color:var(--ink-3)}
.lrow .lt{font-weight:700;min-width:0}
.lrow .lsub{display:block;font-weight:500;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.lrow.next .st{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.lrow.locked{color:var(--ink-3)}
.lrow.locked .lt{font-weight:600}
.lrow .meta{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:700;white-space:nowrap;padding-left:8px}
.lrow.next .meta{color:var(--accent)}

/* dictionary */
.search{width:100%;height:50px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font-family:inherit;font-size:16px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:700;font-size:13.5px;cursor:pointer}
.fchip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2);margin:4px 0 10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--plum)}
.drow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);cursor:pointer}
.drow .dt{font-weight:800;font-size:16px;min-width:0}
.drow .de{display:block;font-size:13.5px;color:var(--ink-2);font-weight:500}
.drow.locked .dt{color:var(--ink-3)}
.boxes{margin-left:auto;display:flex;gap:3px;flex:none}
.boxes i{width:6px;height:18px;border-radius:2px;background:var(--line)}
.boxes i.f{background:var(--accent)}
.lock{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.dexp{padding:10px 0 6px}
.empty{color:var(--ink-3);padding:18px 0}

/* notes */
textarea{width:100%;min-height:112px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;font-family:inherit;font-size:15.5px;line-height:1.5;resize:vertical}
.note{padding:16px 0;border-bottom:1px solid var(--line)}
.note .nt{font-weight:800}
.note .np{color:var(--ink-2);font-size:14.5px;margin:4px 0 8px}
.starred{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.starred b{font-weight:800}
.starred span{color:var(--ink-2);font-size:14px}
.starred button{margin-left:auto}
.saved{font-size:12.5px;color:var(--ok);font-weight:700;height:18px;margin-top:4px}

/* settings */
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:38px;padding:0 15px;border-radius:999px;border:0;background:none;color:var(--ink-2);font-weight:700;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.setrow{padding:16px 0;border-bottom:1px solid var(--line)}
.setrow h3{margin-bottom:8px}
.lvl-list{list-style:none;padding:0;margin:8px 0}
.lvl-list li{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.lvl-list b{min-width:34px;color:var(--accent)}
.lvl-list span{color:var(--ink-3);margin-left:auto;font-size:13.5px;white-space:nowrap}

/* sim */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:90%;padding:12px 14px;border-radius:18px;font-size:15.5px;line-height:1.5}
.bub p{margin:0 0 8px}
.bub p:last-child{margin:0}
.bub.vc{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.bub .who{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.bub.me .who{color:rgba(255,255,255,.75)}
.simbox{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--paper);padding:8px 0 4px}
.simbox textarea{min-height:88px}

/* speed */
.speed-top{display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px;gap:12px}
.speed-score{font-size:44px;font-weight:900;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.speed-time{font-size:16px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.center-block{text-align:center;padding:34px 0}
.center-block .btnrow{justify-content:center}

/* md from AI */
.md h3{font-size:16px;margin:14px 0 4px}
.md ul{margin:4px 0 10px;padding-left:20px}
.md li{margin-bottom:4px}

/* toast & confetti */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:60;max-width:min(92vw,560px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
.confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx,0px),108vh,0) rotate(620deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:760px){h1{font-size:34px}.hero{padding:26px 26px 22px}}
@media (max-width:370px){.bname{display:none}}
.brand{min-width:0}.brand .bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{flex:none}.chip{white-space:nowrap}

let toastT = null;
function toast(msg) { $toast.textContent = msg; $toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $toast.classList.remove('show'), 2800); }

/* ================= state ================= */
const LS_KEY = 'kurs.' + (COURSE.config && COURSE.config.id || 'kurs') + '.v1';
const fresh = () => ({ v: 1, created: Date.now(), updatedAt: 0, xp: 0, cards: {}, lessonsDone: {}, boss: {}, days: {}, sessions: 0, notes: {}, noteXP: {}, stars: {}, badges: {}, speed: { acr: 0, def: 0 }, run: 0, bestRun: 0, weekBonus: {}, demo: 0, settings: { goal: CFG.goal, theme: 'auto', name: '' } });
function normalize(s) {
  const f = fresh();
  if (!s || typeof s !== 'object' || s.v !== 1) return f;
  const o = Object.assign(f, s);
  o.settings = Object.assign(fresh().settings, s.settings || {});
  o.speed = Object.assign({ acr: 0, def: 0 }, s.speed || {});
  ['cards', 'lessonsDone', 'boss', 'days', 'notes', 'noteXP', 'stars', 'badges', 'weekBonus'].forEach(k => { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; });
  return o;
}
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
const HAD_STATE = !!loadLocal();
let S = normalize(loadLocal());
// nowa osoba nie potrzebuje „Co nowego” – zna od razu aktualną wersję
if (!HAD_STATE || (!S.sessions && !Object.keys(S.lessonsDone).length)) S.seenVersion = VERSION;
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* storage may be unavailable */ } }
function save() { S.updatedAt = Date.now(); writeLocal(); }

/* ================= theme ================= */
const HOST_THEME = document.documentElement.getAttribute('data-theme');
function applyTheme() { const t = S.settings.theme, el = document.documentElement; if (t === 'light' || t === 'dark') el.setAttribute('data-theme', t); else if (HOST_THEME) el.setAttribute('data-theme', HOST_THEME); else el.removeAttribute('data-theme'); }

/* ================= spaced repetition ================= */
function learnCard(id) { if (S.cards[id]) return false; S.cards[id] = { b: 1, due: dayNum() + 1, n: 0, ok: 0 }; return true; }
function grade(id, g) {
  const today = dayNum();
  const c = S.cards[id] || (S.cards[id] = { b: 1, due: today, n: 0, ok: 0 });
  c.n++; c.last = today;
  if (g === 0) { c.b = 1; c.due = today + 1; }
  else if (g === 1) { c.b = Math.max(1, c.b); c.due = today + Math.max(1, Math.round(INTERVALS[c.b] / 2)); c.ok++; }
  else { const was = c.b; c.b = Math.min(5, c.b + 1); c.due = today + (was === 5 ? 60 : INTERVALS[c.b]); c.ok++; }
}
function duePool(limit) {
  const t = dayNum();
  return Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].due <= t)
    .sort((a, b) => (S.cards[a].due - S.cards[b].due) || (S.cards[a].b - S.cards[b].b)).slice(0, limit);
}
const dueCount = () => { const t = dayNum(); return Object.keys(S.cards).filter(id => CARDS[id] && S.cards[id].due <= t).length; };
const learnedIds = () => Object.keys(S.cards).filter(id => CARDS[id]);

/* ================= progress ================= */
const stageComplete = st => st.lessons.every(l => S.lessonsDone[l.id]);
const bossPassed = st => (S.boss[st.id] || 0) >= BOSS_PASS;
function nextLessonIndex() { for (let i = 0; i < LESSONS.length; i++) if (!S.lessonsDone[LESSONS[i].id]) return i; return -1; }
function pendingBoss() { for (const st of STAGES) { if (!stageComplete(st)) return null; if (!bossPassed(st)) return st; } return null; }
function lessonUnlocked(ls) { if (ls.gi === 0) return true; const prev = LESSONS[ls.gi - 1]; if (!S.lessonsDone[prev.id]) return false; if (prev.stage !== ls.stage && !bossPassed(prev.stage)) return false; return true; }
const courseDone = () => STAGES.every(st => stageComplete(st) && bossPassed(st));
function plan() { const boss = pendingBoss(); const ni = nextLessonIndex(); const lesson = (!boss && ni >= 0 && lessonUnlocked(LESSONS[ni])) ? LESSONS[ni] : null; return { due: dueCount(), boss, lesson, done: courseDone() }; }
function levelOf(xp) { let i = 0; LEVELS.forEach((l, k) => { if (xp >= l.min) i = k; }); return { L: LEVELS[i], i, next: LEVELS[i + 1] || null }; }
function weekCount(ws) { let n = 0; for (let d = ws; d < ws + 7; d++) if (S.days[d]) n++; return n; }
function streakWeeks() { const goal = S.settings.goal; const ws = weekStart(dayNum()); let n = weekCount(ws) >= goal ? 1 : 0; let w = ws - 7; while (weekCount(w) >= goal) { n++; w -= 7; } return n; }
function addXP(n) { S.xp += n; if (session) session.xp += n; }

/* ================= badges ================= */
let newBadges = [];
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now(); newBadges.push(id);
  if (!session) { const b = BADGES.find(x => x.id === id); if (b) toast(TX.newBadge(b)); }
}
function checkBadges() {
  const done = Object.keys(S.lessonsDone).length;
  if (done >= 1) award('first');
  if (done >= Math.ceil(LESSONS.length / 2)) award('half');
  if (Object.keys(S.weekBonus).length >= 1) award('week');
  const sw = streakWeeks(); if (sw >= 3) award('streak3'); if (sw >= 6) award('streak6');
  if (Object.values(S.cards).filter(c => c.b >= 4).length >= 25) award('elephant');
  if (Math.max(S.speed.acr || 0, S.speed.def || 0) >= 15) award('flash15');
  if ((S.bestRun || 0) >= 10) award('perfect');
  if (Object.keys(S.days).length >= 30) award('marathon');
  const notesN = Object.values(S.notes).filter(v => String(v).trim().length >= 20).length;
  if (Object.keys(S.stars).length >= 5 && notesN >= 5) award('notes');
  STAGES.forEach(st => { if (st.badge && (S.boss[st.id] || 0) >= BOSS_PASS) award('st_' + st.id); });
  if ((S.demo || 0) >= DEMO_PASS) award('demo');
}

/* ================= question factory ================= */
// Zasłania hasło w opisie razem z odmienionymi formami (Arystoteles → Arystotelesa,
// jaskinia → jaskini, pierścień → pierścienia). Słowa krótsze niż 4 litery tylko dokładnie.

  const starred = CARD_LIST.filter(c => S.stars[c.id]);
  const withTask = LESSONS.filter(l => S.lessonsDone[l.id] || S.notes[l.id]);
  let h = `<h1>${esc(L.notesTitle)}</h1><p class="muted">${esc(L.notesIntro)}</p>`;
  h += `<h2>${esc(L.notesStars)} (${starred.length})</h2>`;
  h += starred.length ? starred.map(c => `<div class="starred"><div><b>${esc(c.t)}</b><br><span>${esc(c.sub)}</span></div><button class="pill on" data-act="star" data-id="${c.id}" aria-pressed="true">${esc(TX.unstar)}</button></div>`).join('') : `<p class="small muted">${esc(TX.starHint(L.dictTitle))}</p>`;
  h += `<h2>${esc(TX.tasksTitle)}</h2>`;
  h += withTask.length ? withTask.map(l => `<div class="note"><div class="nt">${TX.lessonN(l.n, esc(l.title))}</div><p class="np">${esc(l.task)}</p>${l.hint && S.lessonsDone[l.id] ? `<p class="small muted"><strong>${esc(L.hintTitle)}:</strong> ${esc(l.hint)}</p>` : ''}<textarea data-note="${l.id}" placeholder="${esc(TX.yourAnswer)}">${esc(S.notes[l.id] || '')}</textarea><div class="saved" id="saved-${l.id}"></div></div>`).join('') : `<p class="small muted">${esc(TX.firstTask)}</p>`;
  h += `<h2>${esc(TX.exportTitle)}</h2><p class="small muted">${esc(TX.exportIntro)}</p><div class="btnrow"><button class="btn" data-act="notes-dl">${esc(TX.dlFile)}</button><button class="btn ghost" data-act="notes-copy">${esc(TX.copyAll)}</button></div>`;
  $view.innerHTML = h;
}
function notesMarkdown() {
  const d = new Date().toLocaleDateString(LOC);
  let m = TX.mdHead(L.notesFile, CFG.title, d) + `## ${L.notesStars}\n\n`;
  const starred = CARD_LIST.filter(c => S.stars[c.id]);
  m += starred.length ? starred.map(c => `- **${c.t}**${c.exp ? ` (${c.exp})` : ''} – ${c.sub}${c.f ? ` ${L.secF}: ${c.f}.` : ''}`).join('\n') : TX.none;
  m += `\n\n## ${TX.tasksTitle}\n`;
  LESSONS.forEach(l => { if (S.notes[l.id]) m += `\n### ${TX.lessonN(l.n, l.title)}\n\n**${TX.mdTask}:** ${l.task}\n\n${l.hint ? `**${L.hintTitle}:** ${l.hint}\n\n` : ''}${S.notes[l.id]}\n`; });
  return m;
}
function blobDownload(name, text, type) {
  try { const url = URL.createObjectURL(new Blob([text], { type })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; } catch (e) { return false; }
}
function notesDownload() {
  if (!blobDownload(`${L.notesFile}.md`, notesMarkdown(), 'text/markdown')) toast(TX.dlFail);
}
async function notesCopy() {
  const txt = notesMarkdown();
  try { await navigator.clipboard.writeText(txt); toast(TX.copied); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {} ta.remove();
    toast(ok ? TX.copied : TX.copyFail);
  }
}

/* ================= render: settings ================= */
let resetArm = 0;
function renderSettings() {
  const lv = levelOf(S.xp).L;
  let h = `<h1>${esc(TX.setTitle)}</h1>`;
  h += `<div class="setrow"><h3>${esc(TX.goalTitle)}</h3><div class="seg">${[2, 3, 4, 5].map(g => `<button class="${S.settings.goal === g ? 'on' : ''}" data-act="goal" data-g="${g}">${TX.sessions(g)}</button>`).join('')}</div><p class="small muted" style="margin-top:8px">${esc(TX.goalNote)}</p></div>`;
  h += `<div class="setrow"><h3>${esc(TX.themeTitle)}</h3><div class="seg">${TX.themes.map(([k, l]) => `<button class="${S.settings.theme === k ? 'on' : ''}" data-act="theme" data-t="${k}">${l}</button>`).join('')}</div></div>`;
  h += `<div class="setrow"><h3>${esc(TX.nameTitle)}</h3><p class="small muted">${esc(TX.nameNote)}</p><input class="search" id="nameInput" type="text" maxlength="24" placeholder="${esc(TX.namePh)}" value="${esc(S.settings.name || '')}"></div>`;
  h += `<div class="setrow"><h3>${esc(TX.saveTitle)}</h3><p class="small muted" style="margin:0">${esc(TX.saveNote)}</p><p class="small muted" style="margin:8px 0 0">${esc(TX.versionNote(VERSION))}</p></div>`;
  h += `<div class="setrow"><h3>${esc(TX.backupTitle)}</h3><p class="small muted">${esc(TX.backupNote)}</p><div class="btnrow"><button class="btn small" data-act="backup">${esc(TX.backupDl)}</button><label class="btn small ghost" style="cursor:pointer">${esc(TX.backupLoad)}<input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div></div>`;
  h += `<div class="setrow"><h3>${esc(TX.learnTitle)}</h3><p class="small">${TX.learnP1}</p><p class="small">${TX.learnP2()}</p></div>`;
  h += `<div class="setrow"><h3>${esc(TX.levelsTitle)}</h3><p class="small muted">${esc(L.levelsNote)}${TX.nowLevel(lv.code, esc(lv.name))}</p><ul class="lvl-list">${LEVELS.map(l => `<li><b>${l.code}</b>${esc(l.name)}<span>${TX.fromXP(fmt(l.min))}</span></li>`).join('')}</ul><p class="small muted">${esc(TX.xpRules())}</p></div>`;
  h += `<div class="setrow"><h3>${esc(TX.resetTitle)}</h3><p class="small muted">${esc(TX.resetNote)}</p><button class="btn ghost small" data-act="reset">${esc(resetArm && Date.now() - resetArm < 5000 ? TX.resetSure : TX.resetBtn)}</button></div>`;
  $view.innerHTML = h;
}

/* ================= confetti ================= */
function confetti() {
  if (reduced()) return;
  const wrap = document.createElement('div'); wrap.className = 'confetti'; const colors = ['#550C93', '#F0386B', '#FFC914'];
  for (let i = 0; i < 48; i++) { const s = document.createElement('i'); s.style.left = (Math.random() * 100) + '%'; s.style.background = colors[i % 3]; s.style.animationDelay = (Math.random() * 0.35) + 's'; s.style.animationDuration = (1.5 + Math.random() * 1.2) + 's'; s.style.setProperty('--dx', ((Math.random() - 0.5) * 160) + 'px'); if (i % 4 === 0) s.style.borderRadius = '50%'; wrap.appendChild(s); }
  document.body.appendChild(wrap); setTimeout(() => wrap.remove(), 3200);
}

/* ================= events ================= */
const ACT = {
  tab: el => { if (trainMode === 'speed') { clearInterval(speedInt); speed = null; trainMode = null; } tab = el.dataset.tab; window.scrollTo(0, 0); render(); },
  start: () => startSession('full'),
  mini: () => startSession('mini'),
  demo: () => startSession('demo'),
  flip: () => { const st = cur(); if (st && st.type === 'review' && !st.flipped) { st.flipped = true; render(); } },
  grade: el => gradeReview(+el.dataset.g),
  opt: el => answer(+el.dataset.i),
  next: () => { const st = cur(); if (st && st.type === 'quiz' && st.answered == null) return; if (st && st.type === 'review' && st.mode === 'mc' && st.answered == null) return; advance(); },
  'learn-next': () => learnNext(),
  'task-save': () => taskDone(false),
  'task-skip': () => taskDone(true),
  exit: () => { if (!session) return; if (cur().type === 'summary') return endSession(); session.exitAsk = true; render(); },
  'exit-yes': () => endSession(),
  'exit-no': () => { if (session) { session.exitAsk = false; render(); } },
  finish: () => endSession(),
  star: el => toggleStar(el.dataset.id),
  lesson: el => openLesson(el.dataset.id),
  bossrow: el => openBoss(el.dataset.id),
  'demo-row': () => { if (!courseDone()) return toast(TX.demoLocked()); startSession('demo'); },
  speed: el => startSpeed(el.dataset.mode),
  'speed-opt': el => answerSpeed(+el.dataset.i),
  'speed-exit': () => { clearInterval(speedInt); speed = null; trainMode = null; render(); },
  'dict-stage': el => { dictStage = +el.dataset.i; document.querySelectorAll('[data-act="dict-stage"]').forEach(b => b.classList.toggle('on', +b.dataset.i === dictStage)); renderDictList(); },
  'dict-open': el => { dictOpen = dictOpen === el.dataset.id ? null : el.dataset.id; renderDictList(); },
  'news-ok': () => { S.seenVersion = VERSION; save(); render(); },
  'notes-dl': () => notesDownload(),
  'notes-copy': () => notesCopy(),
  goal: el => { S.settings.goal = +el.dataset.g; save(); render(); },
  theme: el => { S.settings.theme = el.dataset.t; applyTheme(); save(); render(); },
  backup: () => { const d = new Date().toISOString().slice(0, 10); if (blobDownload(`${CFG.id}-${TX.backupWord}-${d}.json`, JSON.stringify(S), 'application/json')) toast(TX.backupOk); else toast(TX.backupFail); },
  reset: () => { if (resetArm && Date.now() - resetArm < 5000) { const keepTheme = S.settings.theme; S = fresh(); S.settings.theme = keepTheme; resetArm = 0; S.seenVersion = VERSION; save(); tab = 'home'; toast(TX.resetDone); render(); } else { resetArm = Date.now(); render(); setTimeout(() => { if (tab === 'settings' && !session) render(); }, 5200); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'dictQ') { dictQ = t.value; renderDictList(); return; }
  if (t.id === 'nameInput') { S.settings.name = t.value.slice(0, 24); clearTimeout(noteTimers.__name); noteTimers.__name = setTimeout(save, 500); return; }
  if (t.dataset && t.dataset.note) {
    const id = t.dataset.note; clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(() => {
      const v = t.value.trim(); if (v) S.notes[id] = v; else delete S.notes[id];
      if (v.length >= 20 && !S.noteXP[id]) { S.noteXP[id] = 1; S.xp += 15; renderTop(); }
      checkBadges(); save();
      const s = document.getElementById('saved-' + id); if (s) { s.textContent = TX.saved; setTimeout(() => { if (s) s.textContent = ''; }, 1500); }
    }, 700);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'dictAll') { dictAll = e.target.checked; renderDictList(); return; }
  if (e.target.id === 'restoreFile' && e.target.files && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || typeof o.cards !== 'object') throw new Error('bad'); S = normalize(o); save(); applyTheme(); tab = 'home'; render(); toast(TX.restored); } catch (err) { toast(TX.badFile); } };
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  if (trainMode === 'speed' && speed && !speed.over && !session && tab === 'train') { const k = '1234'.indexOf(e.key); if (k >= 0) { e.preventDefault(); answerSpeed(k); } return; }
  if (!session) return;
  const st = cur(); if (!st) return;
  const k = '1234'.indexOf(e.key);
  const isQ = st.type === 'quiz' || (st.type === 'review' && st.mode === 'mc');
  if (isQ && st.answered == null && k >= 0 && st.q && k < st.q.options.length) { e.preventDefault(); answer(k); return; }
  if (st.type === 'review' && st.mode !== 'mc') {
    if (!st.flipped && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); ACT.flip(); return; }
    if (st.flipped && k >= 0 && k <= 2) { e.preventDefault(); gradeReview(k); return; }
  }
  if (e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('button'))) {
    if (isQ && st.answered != null) { e.preventDefault(); advance(); }
    else if (st.type === 'learn') { e.preventDefault(); learnNext(); }
    else if (['intro', 'boss-intro', 'boss-result', 'demo-intro', 'demo-result'].includes(st.type)) { e.preventDefault(); advance(); }
  }
});

/* ================= boot ================= */
applyTheme();
document.documentElement.lang = LANG;
document.querySelectorAll('[data-tl]').forEach(el => { const k = el.dataset.tl; if (k === 'dict') el.textContent = L.dictTitle; else if (k === 'notes') el.textContent = L.notesTitle; else if (TX.tabs[k]) el.textContent = TX.tabs[k]; });
if ($tabs) $tabs.setAttribute('aria-label', TX.navAria);
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();


</script>
</body>
